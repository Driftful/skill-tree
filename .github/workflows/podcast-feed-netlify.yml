name: Deploy Podcast Feed Redirect

on:
  workflow_dispatch:
  push:
    paths:
      - "assets/site/**"
      - ".github/workflows/podcast-feed-netlify.yml"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate feed redirect
        run: |
          test -f assets/site/_redirects
          grep -Eq '^/feed\.xml[[:space:]]+https://feeds\.transistor\.fm/skill-tree[[:space:]]+302!$' assets/site/_redirects

      - name: Deploy to Netlify with CLI
        run: npx --yes netlify-cli deploy --dir=assets/site --prod --site="$NETLIFY_SITE_ID" --auth="$NETLIFY_AUTH_TOKEN"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
