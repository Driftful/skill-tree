user:
  get:
    "GET:/v1":
      description: "Retrieve details of the user account that is authenticating to the API."
      return_type: "User"
      parameters: {}
shows:
  list:
    "GET:/v1/shows":
      description: "Retrieve a paginated list of shows in descending order by updated date."
      return_type: "Show[]"
      parameters:
        private: "Boolean?: Filter for private shows"
        query: "String?: Search query"
        pagination[page]: "Integer?: Page number"
        pagination[per]: "Integer?: Resources per page"
  get:
    "GET:/v1/shows/:id":
      description: "Retrive a single show (podcast)."
      return_type: "Show"
      parameters:
        id: "String: Show ID or slug"
  update:
    "PATCH:/v1/shows/:id":
      description: "Update a show with any or all of the following attributes."
      return_type: "Show"
      parameters:
        id: "String: Show ID or slug"
        show[author]: "String?: Podcast author"
        show[category]: "String?: Primary category"
        show[copyright]: "String?: Copyright information"
        show[description]: "String?: Podcast description"
        show[explicit]: "Boolean?: Podcast contains explicit content"
        show[image_url]: "String?: Podcast artwork image URL"
        show[keywords]: "String?: Comma-separated list of keywords"
        show[language]: "String?: Podcast's spoken language"
        show[owner_email]: "String?: Podcast owner email"
        show[secondary_category]: "String?: Secondary category"
        show[show_type]: "String?: Publishing type. Episodic displays newest episodes, serial displays oldest first"
        show[title]: "String?: Podcast title"
        show[time_zone]: "String?: Publishing time zone"
        show[website]: "String?: Podcast website"
  analytics:
    "GET:/v1/analytics/:id":
      description: "Retrieve analytics of downloads per day for an entire podcast. Defaults to the last 14 days."
      return_type: "ShowAnalytics"
      parameters:
        id: "String: Show ID or slug"
        start_date: "String?: Optional starting date for analytics (dd-mm-yyyy). Required if using an ending date."
        end_date: "String?: Optional ending date for analytics (dd-mm-yyyy). Required if using a starting date."
episodes:
  list:
    "GET:/v1/episodes":
      description: "Retrieve a paginated list of episodes ordered by published date."
      return_type: "Episode[]"
      parameters:
        show_id: "String?: Show ID or slug"
        query: "String?: Search query"
        status: "String?: Publishing status: published, scheduled, or draft"
        order: "String?: Return order of episodes. Newest first (desc), or oldest first (asc)"
        pagination[page]: "Integer?: Page number"
        pagination[per]: "Integer?: Resources per page"
  create:
    "POST:/v1/episodes":
      description: "Create a new draft episode for the specified show. Note that publishing an episode involves a separate endpoint."
      return_type: "Episode"
      parameters:
        episode[show_id]: "String: ID or Slug of the Show to add an episode to"
        episode[audio_url]: "String?: URL to an episode's new audio file"
        episode[transcript_text]: "String?: Full text of the episode transcript"
        episode[author]: "String?: Episode author"
        episode[description]: "String?: Longer episode description which may contain HTML and unformatted tags for chapters, people, supporters, etc"
        episode[explicit]: "Boolean?: Episode contains explicit content"
        episode[image_url]: "String?: Episode artwork image URL"
        episode[keywords]: "String?: Comma-separated list of keywords"
        episode[number]: "Integer?: Episode number"
        episode[season]: "Integer?: Season number"
        episode[type]: "String?: Full, trailer, or bonus episode"
        episode[title]: "String?: Episode title"
        episode[alternate_url]: "String?: Alternate episode URL overriding the share_url"
        episode[video_url]: "String?: YouTube video URL to be embedded on episode sharing pages and website pages"
        episode[email_notifications]: "Boolean?: Private podcast email notifications override (defaults to Show setting)"
        episode[increment_number]: "Boolean?: Automatically set the number to the next episode number of the current season"
  get:
    "GET:/v1/episodes/:id":
      description: "Retrieve a single podcast episode."
      return_type: "Episode"
      parameters:
        id: "String: Episode ID"
  update:
    "PATCH:/v1/episodes/:id":
      description: "Update a single podcast episode. Note that publishing or unpublishing an episode involves a separate endpoint."
      return_type: "Episode"
      parameters:
        id: "String: Episode ID"
        episode[audio_url]: "String?: URL to an episode's new audio file"
        episode[transcript_text]: "String?: Full text of the episode transcript"
        episode[author]: "String?: Episode author"
        episode[description]: "String?: Longer episode description which may contain HTML and unformatted tags for chapters, people, supporters, etc"
        episode[explicit]: "Boolean?: Episode contains explicit content"
        episode[image_url]: "String?: Episode artwork image URL"
        episode[keywords]: "String?: Comma-separated list of keywords"
        episode[number]: "Integer?: Episode number"
        episode[season]: "Integer?: Season number"
        episode[type]: "String?: Full, trailer, or bonus episode"
        episode[title]: "String?: Episode title"
        episode[alternate_url]: "String?: Alternate episode URL overriding the share_url"
        episode[video_url]: "String?: YouTube video URL to be embedded on episode sharing pages and website pages"
        episode[email_notifications]: "Boolean?: Private podcast email notifications override (defaults to Show setting)"
  publish:
    "PATCH:/v1/episodes/:id/publish?episode[status]=published":
      description: "Publish a single episode now or in the past, schedule for the future, or revert to a draft."
      return_type: "Episode"
      parameters:
        id: "String: Episode ID"
        episode[published_at]: "String?: Episode publishing date and time - in your podcast's time zone"
  schedule:
    "PATCH:/v1/episodes/:id/publish?episode[status]=scheduled":
      description: "Publish a single episode now or in the past, schedule for the future, or revert to a draft."
      return_type: "Episode"
      parameters:
        id: "String: Episode ID"
        episode[published_at]: "String?: Episode publishing date and time - in your podcast's time zone"
  unpublish:
    "PATCH:/v1/episodes/:id/publish?episode[status]=draft":
      description: "Publish a single episode now or in the past, schedule for the future, or revert to a draft."
      return_type: "Episode"
      parameters:
        id: "String: Episode ID"
        episode[published_at]: "String?: Episode publishing date and time - in your podcast's time zone"
  upload:
    "GET:/v1/episodes/authorize_upload":
      description: "Authorize a URL for uploading a local audio file to be used when creating or updating an episode."
      return_type: "AudioUpload"
      parameters:
        filename: "String: Filename of the audio file you wish to upload"
    "PUT:{upload_url}":
      description: "Upload your audio file using the authorized upload_url and content_type."
      parameters:
        Content-Type: "String: Content type of the audio file to upload"
        file: "File: Audio file uploaded to the authorized upload_url"
  analytics:
    "GET:/v1/analytics/:id/episodes":
      description: "Retrieve analytics of downloads per day for all episodes of a podcast. Defaults to the last 7 days."
      return_type: "EpisodesAnalytics"
      parameters:
        id: "String: Show ID or slug"
        start_date: "String?: Optional starting date for analytics (dd-mm-yyyy). Required if using an ending date."
        end_date: "String?: Optional ending date for analytics (dd-mm-yyyy). Required if using a starting date."
    "GET:/v1/analytics/episodes/:id":
      description: "Retrieve analytics of downloads per day for a single episode. Defaults to the last 14 days."
      return_type: "EpisodeAnalytics"
      parameters:
        id: "String: Episode ID or slug"
        start_date: "String?: Optional starting date for analytics (dd-mm-yyyy). Required if using an ending date."
        end_date: "String?: Optional ending date for analytics (dd-mm-yyyy). Required if using a starting date."
subscribers:
  list:
    "GET:/v1/subscribers":
      description: "Retrieve a list of all subscribers for a single private podcast."
      return_type: "Subscriber[]"
      parameters:
        show_id: "String: Show ID or slug"
        query: "String?: Search query"
        pagination[page]: "Integer?: Page number"
        pagination[per]: "Integer?: Resources per page"
  get:
    "GET:/v1/subscribers/:id":
      description: "Retrieve a single private podcast subscriber."
      return_type: "Subscriber"
      parameters:
        id: "String: Subscriber ID"
  create:
    "POST:/v1/subscribers":
      description: "Add a single subscriber to a private podcast, and send an optional instructional email."
      return_type: "Subscriber"
      parameters:
        show_id: "String: Show ID or slug"
        email: "String: Email address"
        skip_welcome_email: "Boolean?: Do not send the instructional email"
    "POST:/v1/subscribers/batch":
      description: "Add a batch of multiple subscribers to a private podcast, and send them optional instructional emails."
      return_type: "Subscriber[]"
      parameters:
        show_id: "String: Show ID or slug"
        emails: "[String]: Array of email addresses"
        skip_welcome_email: "Boolean?: Do not send the instructional emails"
  update:
    "PATCH:/v1/subscribers/:id":
      description: "Update a single private podcast subscriber."
      return_type: "Subscriber"
      parameters:
        id: "String: Subscriber ID"
        subscriber[email]: "String: Subscriber's email address"
  delete:
    "DELETE:/v1/subscribers":
      description: "Remove a single private podcast subscriber and revoke their access to the podcast."
      return_type: "Subscriber"
      parameters:
        show_id: "String: Show ID or slug"
        email: "String: Email address"
    "DELETE:/v1/subscribers/:id":
      description: "Remove a single private podcast subscriber and revoke their access to the podcast."
      return_type: "Subscriber"
      parameters:
        id: "String: Subscriber ID"
webhooks:
  list:
    "GET:/v1/webhooks":
      description: "Retrieve a list of webhooks for a show"
      return_type: "Webhook[]"
      parameters:
        show_id: "String: Show ID or slug"
  subscribe:
    "POST:/v1/webhooks":
      description: "Subscribe to a webhook with the given event name and show."
      return_type: "Webhook"
      parameters:
        event_name: "String: Name of webhook event"
        show_id: "String: Show ID or slug"
        url: "String: Target URL for webhook delivery"
  unsubscribe:
    "DELETE:/v1/webhooks/:id":
      description: "Unsubscribe from a webhook."
      return_type: "Webhook"
      parameters:
        id: "String: Webhook ID"
